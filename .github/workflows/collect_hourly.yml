name: Recolha horaria

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  # Os crons so recolhem dentro do periodo definido nas variaveis do repo
  # COLLECT_START e COLLECT_END (UTC, ex.: 2026-10-20T00:00:00Z). Sem
  # variavel, esse limite nao se aplica. Runs manuais ignoram o periodo.
  # Os crons so correm no repo publico, nunca no repo de entrega do grupo.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          START: ${{ vars.COLLECT_START }}
          END: ${{ vars.COLLECT_END }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          now=$(date -u +%s)
          run=true
          if [ "$EVENT" = "schedule" ]; then
            if [ "$REPO" != "Fegue3/Steam-Analytics" ]; then run=false; fi
            if [ -n "$START" ] && [ "$now" -lt "$(date -u -d "$START" +%s)" ]; then run=false; fi
            if [ -n "$END" ] && [ "$now" -ge "$(date -u -d "$END" +%s)" ]; then run=false; fi
          fi
          echo "Periodo: ${START:-sem inicio} a ${END:-sem fim}; recolher: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  collect:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m src.collect_players --out store
      - run: python -m src.collect_store --out store
        if: always()
      - name: Commit e push para o branch data
        if: always()
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw logs
          git diff --cached --quiet && exit 0
          git commit -m "Recolha horaria $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin data && git push origin data && exit 0
            sleep $((i * 10))
          done
          exit 1
