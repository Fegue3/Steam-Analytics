name: Recolha horaria

on:
  # O cron do GitHub atrasa ou salta execucoes, por isso ha cinco tentativas
  # por hora. So a primeira recolhe; as seguintes veem que a hora ja tem
  # dados e terminam sem recolher. Opcionalmente, o cron-job.org pode disparar
  # o workflow (workflow_dispatch com scheduled=true), ver docs/agendamento.md.
  schedule:
    - cron: "7 * * * *"
    - cron: "17 * * * *"
    - cron: "29 * * * *"
    - cron: "41 * * * *"
    - cron: "53 * * * *"
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Run agendado (cron-job.org): aplica o periodo de recolha"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  # Os runs agendados (cron do GitHub ou cron-job.org com scheduled=true) so
  # recolhem dentro do periodo definido nas variaveis do repo COLLECT_START e
  # COLLECT_END (UTC, ex.: 2026-10-20T00:00:00Z). Sem variavel, esse limite
  # nao se aplica. Runs manuais ignoram o periodo. Os runs agendados so
  # recolhem no repo publico, nunca no repo de entrega do grupo.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          START: ${{ vars.COLLECT_START }}
          END: ${{ vars.COLLECT_END }}
          SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled }}
          REPO: ${{ github.repository }}
        run: |
          now=$(date -u +%s)
          run=true
          if [ "$SCHEDULED" = "true" ]; then
            if [ "$REPO" != "Fegue3/Steam-Analytics" ]; then run=false; fi
            if [ -n "$START" ] && [ "$now" -lt "$(date -u -d "$START" +%s)" ]; then run=false; fi
            if [ -n "$END" ] && [ "$now" -ge "$(date -u -d "$END" +%s)" ]; then run=false; fi
          fi
          echo "Periodo: ${START:-sem inicio} a ${END:-sem fim}; recolher: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  collect:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m src.collect_players --out store
      - run: python -m src.collect_store --out store
        if: always()
      - name: Commit e push para o branch data
        if: always()
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw logs
          git diff --cached --quiet && exit 0
          git commit -m "Recolha horaria $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin data && git push origin data && exit 0
            sleep $((i * 10))
          done
          exit 1
